name: Release to App Store

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit for review after upload"
        type: boolean
        default: false
      screenshots:
        description: "Capture and upload screenshots"
        type: boolean
        default: true

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -z "$XCODE_APP" ]; then XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1); fi
        sudo xcode-select -s "/Applications/$XCODE_APP"
        xcodebuild -version

    - name: Set build number
      run: |
        BUILD_NUM=$(( ${{ github.run_number }} + 1 ))
        echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
        sed -i "" "s/CURRENT_PROJECT_VERSION: [0-9]*/CURRENT_PROJECT_VERSION: $BUILD_NUM/" project.yml

    - name: Generate Xcode project
      run: brew install xcodegen && xcodegen generate

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

    - name: Build Archive
      run: |
        xcodebuild archive \
          -scheme MinnaRec \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath build/MinnaRec.xcarchive \
          CURRENT_PROJECT_VERSION=${BUILD_NUM} \
          CODE_SIGN_STYLE=Automatic \
          DEVELOPMENT_TEAM=83VGKGSQUH \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec | tail -20

    - name: Export and upload IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath build/MinnaRec.xcarchive \
          -exportPath build/export \
          -exportOptionsPlist export_options.plist \
          -allowProvisioningUpdates \
          -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8 \
          -authenticationKeyID WDXGY9WX55 \
          -authenticationKeyIssuerID 2be0734f-943a-4d61-9dc9-5d9045c46fec

    - name: Install Python deps
      run: pip3 install --break-system-packages PyJWT requests Pillow cryptography

    - name: Build app for Simulator
      if: ${{ inputs.screenshots }}
      run: |
        xcodebuild build -scheme MinnaRec -configuration Release -sdk iphonesimulator \
          -destination "generic/platform=iOS Simulator" -derivedDataPath build/sim \
          CODE_SIGNING_ALLOWED=NO | tail -5

    - name: Capture real screenshots
      if: ${{ inputs.screenshots }}
      run: python3 scripts/capture_screenshots.py "build/sim/Build/Products/Release-iphonesimulator/MinnaRec.app" "ja,en" "iphone,ipad"

    - uses: actions/upload-artifact@v4
      if: ${{ inputs.screenshots }}
      with:
        name: shots
        path: shots

    - name: Set Metadata
      run: python3 scripts/set_metadata.py

    - name: Upload Screenshots
      if: ${{ inputs.screenshots }}
      run: python3 scripts/upload_screenshots.py

    - name: Submit for Review
      if: ${{ inputs.submit }}
      run: python3 scripts/submit.py ${{ env.BUILD_NUM }}
