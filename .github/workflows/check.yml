name: Check build and screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      devices:
        description: "iphone,ipad"
        default: "ipad"

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep -E "^Xcode_2[6-9]|^Xcode_[3-9][0-9]" | sort -V | tail -1)
        if [ -z "$XCODE_APP" ]; then XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1); fi
        sudo xcode-select -s "/Applications/$XCODE_APP"
        xcodebuild -version

    - name: Generate Xcode project
      run: brew install xcodegen && xcodegen generate

    - name: Build app for Simulator
      run: |
        set -o pipefail
        xcodebuild build \
          -scheme MinnaRec \
          -configuration Release \
          -sdk iphonesimulator \
          -destination "generic/platform=iOS Simulator" \
          -derivedDataPath build/sim \
          CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
        grep -q "BUILD SUCCEEDED" build.log

    - name: Show errors
      if: failure()
      run: grep -E "error:" build.log | sort -u | head -80

    - name: Capture screenshots
      run: |
        pip3 install --break-system-packages Pillow
        python3 scripts/capture_screenshots.py "build/sim/Build/Products/Release-iphonesimulator/MinnaRec.app" "ja,en" "${{ github.event.inputs.devices || 'ipad' }}"

    - uses: actions/upload-artifact@v4
      with:
        name: shots
        path: shots
